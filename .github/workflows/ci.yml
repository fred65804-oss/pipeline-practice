name: CI

on:
  push:

jobs:
  run: npm run lint
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run ci
        run: npm ci

      - name: Run test
        run: npm test
