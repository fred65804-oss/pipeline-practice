name: CI

on:
  workflow_dispatch:
  push:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Linting
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Run ci
        run: npm ci

      - name: Run test
        run: npm test

  build:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [lint, test]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build docker image
        run: docker build -t ghcr.io/${{ github.repository }}:${{ github.sha }} --build-arg GIT_SHA=${{ github.sha }} .

      - name: Push docker image
        run: docker push ghcr.io/${{ github.repository }}:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Set up SSH Key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
      - name: Write hosts
        env:
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
        run:
          ssh deploy@$DEPLOY_HOST "docker pull $IMAGE && docker rm -f app && docker run -d --name app --restart unless-stopped -p 3000:3000 $IMAGE"
      - name: Health Check
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          body=$(curl -fsS --retry 10 --retry-delay 2 --retry-connrefused --max-time 5 http://$DEPLOY_HOST:3000/health)
          echo "Health response: $body"
          version=$(echo "$body" | jq -r .version)
          if [ "$version" != "$EXPECTED_SHA" ]; then
            echo "Expected $EXPECTED_SHA but the server is running $version"
            exit 1
          fi
